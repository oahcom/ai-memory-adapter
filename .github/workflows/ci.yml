name: CI
on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo build --verbose
    - run: cargo test --lib prune_rolls_back_failure_after_delete_within_batch -- --ignored --test-threads=1
    - run: cargo test --lib initialize_schema_rolls_back_ddl_failure_after_alter -- --ignored --test-threads=1
    - run: cargo test --lib initialize_schema_rolls_back_index_failure_after_first_index -- --ignored --test-threads=1
    - run: cargo test --verbose
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo fmt --all -- --check
